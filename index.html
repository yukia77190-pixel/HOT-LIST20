<style>
  :root{
    --ink:#1a1d24;
    --ink-soft:#3c4150;
    --muted:#8b8678;
    --canvas:#efece6;
    --surface:#ffffff;
    --line:#e4dfd5;
    --line-soft:#efeae1;
    --ember:#e3531f;
    --ember-deep:#b53c12;
    --ember-wash:#fbe9df;
    --green:#2f7d5b;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--canvas);
    color:var(--ink);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:140px;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---- top bar ---- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(239,236,230,.92);
    backdrop-filter:saturate(140%) blur(8px);
    -webkit-backdrop-filter:saturate(140%) blur(8px);
    border-bottom:1px solid var(--line);
    padding:max(12px,env(safe-area-inset-top)) 16px 10px;
  }
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand h1{
    margin:0;font-size:21px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);
  }
  .brand .twenty{
    font-size:21px;font-weight:800;color:var(--ember);letter-spacing:.02em;
  }
  .sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  #savetag{font-size:11px;color:var(--muted);white-space:nowrap;}
  #savetag.ok{color:var(--green);}

  .stats{display:flex;gap:6px;margin-top:10px;}
  .stat{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:7px 8px;text-align:center;
  }
  .stat b{display:block;font-size:18px;font-weight:800;line-height:1.1;}
  .stat span{font-size:10px;color:var(--muted);letter-spacing:.06em;}
  .stat.hot b{color:var(--ember);}
  .stat.sign b{color:var(--green);}

  .controls{display:flex;gap:8px;margin-top:10px;}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{
    appearance:none;border:0;background:transparent;font-family:inherit;
    padding:7px 12px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff;}
  .ghost{
    margin-left:auto;appearance:none;border:1px solid var(--line);background:var(--surface);
    border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);
    font-family:inherit;cursor:pointer;
  }

  /* ---- list ---- */
  main{padding:14px 12px 0;display:flex;flex-direction:column;gap:10px;}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;position:relative;
    box-shadow:0 1px 2px rgba(26,29,36,.04);
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--line);transition:background .25s,box-shadow .25s;
  }
  .card[data-heat="1"]::before{background:var(--ember-wash);}
  .card[data-heat="2"]::before{background:#f3b79b;}
  .card[data-heat="3"]::before{background:#ee8a5e;}
  .card[data-heat="4"]::before{background:var(--ember);}
  .card[data-heat="5"]::before{background:var(--ember-deep);box-shadow:0 0 14px rgba(227,83,31,.55);}

  .head{
    display:flex;align-items:center;gap:11px;padding:13px 14px 13px 16px;cursor:pointer;
    user-select:none;
  }
  .no{
    flex:none;width:30px;height:30px;border-radius:9px;background:var(--canvas);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    color:var(--ink-soft);
  }
  .head-main{flex:1;min-width:0;}
  .nm{font-weight:700;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nm.empty{color:#bdb8ab;font-weight:500;}
  .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .heatwrap{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .pips{display:flex;gap:2px;}
  .pip{width:6px;height:14px;border-radius:2px;background:var(--line-soft);}
  .pip.on{background:var(--ember);}
  .hcount{font-size:10px;color:var(--muted);}
  .chev{flex:none;color:#c7c2b6;transition:transform .2s;font-size:13px;}
  .card.open .chev{transform:rotate(90deg);}

  .body{display:none;padding:2px 14px 16px 16px;border-top:1px solid var(--line-soft);}
  .card.open .body{display:block;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;margin-top:12px;}
  .field.full{grid-column:1 / -1;}
  label.lbl{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 4px 2px;}
  input[type=text],input[type=number]{
    width:100%;font-family:inherit;font-size:16px;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fcfbf9;
  }
  input:focus{outline:2px solid var(--ember);outline-offset:0;border-color:transparent;}
  .inline{display:flex;align-items:center;gap:6px;}
  .inline .unit{font-size:13px;color:var(--muted);}

  .pick{display:flex;gap:6px;flex-wrap:wrap;}
  .pick button{
    appearance:none;font-family:inherit;border:1px solid var(--line);background:#fcfbf9;
    border-radius:9px;padding:8px 0;flex:1;min-width:42px;font-size:14px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;
  }
  .pick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}

  .stagewrap{margin-top:16px;}
  .stagewrap > .lbl{margin-bottom:7px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    appearance:none;font-family:inherit;cursor:pointer;
    border:1px solid var(--line);background:#fcfbf9;color:var(--ink-soft);
    border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;letter-spacing:.02em;
  }
  .chip[aria-pressed="true"]{
    background:var(--ember);border-color:var(--ember);color:#fff;
    box-shadow:0 2px 6px rgba(227,83,31,.3);
  }

  /* ---- footer actions ---- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    padding:10px 14px max(14px,env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(239,236,230,1) 60%,rgba(239,236,230,0));
    display:flex;gap:10px;
  }
  .dock button{
    flex:1;appearance:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
    border-radius:12px;padding:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  }
  .dock button.primary{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---- modal ---- */
  .scrim{
    position:fixed;inset:0;z-index:100;background:rgba(26,29,36,.45);
    display:none;align-items:flex-end;justify-content:center;
  }
  .scrim.show{display:flex;}
  .sheet{
    background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;
    padding:18px 16px max(18px,env(safe-area-inset-bottom));max-height:86vh;overflow:auto;
  }
  .sheet h2{margin:0 0 4px;font-size:17px;}
  .sheet p{margin:0 0 12px;font-size:13px;color:var(--muted);}
  textarea{
    width:100%;height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12px;
    border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);background:#fcfbf9;
  }
  .sheet-actions{display:flex;gap:10px;margin-top:12px;}
  .sheet-actions button{
    flex:1;appearance:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
    border-radius:11px;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  }
  .sheet-actions button.primary{background:var(--ember);color:#fff;border-color:var(--ember);}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  @media (min-width:560px){
    .grid{grid-template-columns:1fr 1fr 1fr;}
    .field.span2{grid-column:span 2;}
  }
</style>
</head>
<body>

<header>
  <div class="titlerow">
    <div class="brand">
      <h1>Hotlist</h1><span class="twenty tnum">20</span>
    </div>
    <span id="savetag">読み込み中…</span>
  </div>
  <div class="sub">Fairtrade · 見込みリスト</div>

  <div class="stats">
    <div class="stat"><b class="tnum" id="st-filled">0</b><span>入力 / 20</span></div>
    <div class="stat hot"><b class="tnum" id="st-ct">0</b><span>CT取り</span></div>
    <div class="stat hot"><b class="tnum" id="st-ft">0</b><span>FT</span></div>
    <div class="stat sign"><b class="tnum" id="st-dlr">0</b><span>DLR</span></div>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="並び替え">
      <button id="sort-no" aria-pressed="true">番号順</button>
      <button id="sort-heat" aria-pressed="false">熱い順</button>
    </div>
    <button class="ghost" id="btn-export">書き出す</button>
  </div>
</header>

<main id="list"></main>

<div class="dock">
  <button id="btn-collapse">すべて閉じる</button>
  <button class="primary" id="btn-export2">Numbersへ書き出す</button>
</div>

<div class="scrim" id="scrim">
  <div class="sheet">
    <h2>リストを書き出す</h2>
    <p>下のテキストを長押し → 全選択してコピー。Numbers / Excel の空セルに貼り付けると表になります。CSVで保存したい場合は下のボタンから。</p>
    <textarea id="exp-area" readonly></textarea>
    <div class="sheet-actions">
      <button id="exp-copy">コピー</button>
      <button id="exp-csv">CSV保存</button>
      <button class="primary" id="exp-close">閉じる</button>
    </div>
  </div>
</div>

<script>
const KEY='hotlist20:v1';
const STAGES=[
  {k:'ctTori',l:'CT取り'},{k:'ct',l:'CT'},{k:'sakusen',l:'作戦会議'},
  {k:'ft',l:'FT'},{k:'pg',l:'PG'},{k:'dlr',l:'DLR'},{k:'exp',l:'EXP'},
  {k:'pa',l:'PA'},{k:'bpc',l:'BPC'},{k:'ur',l:'UR'}
];
const SEX=['男','女'];
const EMP=[['正','正社員'],['非','非正規'],['自','自営']];
const EDU=[['高','高校'],['専','専門'],['大','大学']];

function blank(){const s={};STAGES.forEach(x=>s[x.k]=false);
  return {name:'',sex:'',age:'',area:'',household:'',hometown:'',job:'',emp:'',edu:'',memo:'',stages:s};}
let data=Array.from({length:20},blank);
let sortMode='no';
let openIdx=new Set();

/* ---------- storage : Claudeアプリ内=window.storage / Web公開時=localStorage 両対応 ---------- */
let saveTimer=null;
const hasWS=(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function');
function setTag(t,ok){const e=document.getElementById('savetag');e.textContent=t;e.classList.toggle('ok',!!ok);}
async function readStore(){
  if(hasWS){const r=await window.storage.get(KEY);return r&&r.value?r.value:null;}
  try{return localStorage.getItem(KEY);}catch(e){return null;}
}
async function writeStore(v){
  if(hasWS){await window.storage.set(KEY,v);return;}
  localStorage.setItem(KEY,v);
}
async function load(){
  try{const raw=await readStore();
    if(raw){const a=JSON.parse(raw);
      for(let i=0;i<20;i++){if(a[i])data[i]=Object.assign(blank(),a[i],{stages:Object.assign(blank().stages,a[i].stages||{})});}
    }setTag('保存済み',true);
  }catch(e){setTag('保存OK',true);}
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await writeStore(JSON.stringify(data));setTag('保存済み',true);}
    catch(e){setTag('保存できません',false);}
  },350);
}

/* ---------- helpers ---------- */
function heatCount(p){return STAGES.reduce((n,s)=>n+(p.stages[s.k]?1:0),0);}
function heatLevel(c){return c===0?0:c<=2?1:c<=4?2:c<=6?3:c<=8?4:5;}
function order(){
  let idx=data.map((_,i)=>i);
  if(sortMode==='heat')idx.sort((a,b)=>heatCount(data[b])-heatCount(data[a])||a-b);
  return idx;
}

/* ---------- summary ---------- */
function summary(){
  let filled=0,ct=0,ft=0,dlr=0;
  data.forEach(p=>{if(p.name.trim())filled++;if(p.stages.ctTori)ct++;if(p.stages.ft)ft++;if(p.stages.dlr)dlr++;});
  document.getElementById('st-filled').textContent=filled;
  document.getElementById('st-ct').textContent=ct;
  document.getElementById('st-ft').textContent=ft;
  document.getElementById('st-dlr').textContent=dlr;
}

/* ---------- render ---------- */
const listEl=document.getElementById('list');
function render(){
  listEl.innerHTML='';
  order().forEach(i=>listEl.appendChild(card(i)));
  summary();
}
function pips(c){
  let h='<div class="pips">';
  for(let n=0;n<10;n++)h+=`<span class="pip${n<c?' on':''}"></span>`;
  return h+'</div>';
}
function card(i){
  const p=data[i],c=heatCount(p);
  const el=document.createElement('div');
  el.className='card'+(openIdx.has(i)?' open':'');
  el.dataset.heat=heatLevel(c);

  const metaBits=[];
  if(p.age)metaBits.push(p.age+'歳');
  if(p.area)metaBits.push(p.area);
  if(p.job)metaBits.push(p.job);

  el.innerHTML=`
    <div class="head">
      <div class="no tnum">${i+1}</div>
      <div class="head-main">
        <div class="nm${p.name.trim()?'':' empty'}">${p.name.trim()?esc(p.name):'未入力'}</div>
        <div class="meta">${metaBits.length?esc(metaBits.join(' · ')):'タップして入力'}</div>
      </div>
      <div class="heatwrap">${pips(c)}<span class="hcount tnum">${c}/10</span></div>
      <div class="chev">▶</div>
    </div>
    <div class="body">${body(i)}</div>`;

  el.querySelector('.head').addEventListener('click',()=>{
    if(openIdx.has(i))openIdx.delete(i);else openIdx.add(i);
    render();
  });
  wire(el,i);
  return el;
}

function body(i){
  const p=data[i];
  return `
  <div class="grid">
    <div class="field full"><label class="lbl">フルネーム</label>
      <input type="text" data-f="name" value="${esc(p.name)}" placeholder="氏名"></div>
    <div class="field"><label class="lbl">性別</label>
      <div class="pick" data-pick="sex">${SEX.map(s=>btn(s,s,p.sex===s)).join('')}</div></div>
    <div class="field"><label class="lbl">年齢</label>
      <div class="inline"><input type="number" inputmode="numeric" data-f="age" value="${esc(p.age)}" placeholder="–"><span class="unit">歳</span></div></div>
    <div class="field"><label class="lbl">世帯人数</label>
      <div class="inline"><input type="number" inputmode="numeric" data-f="household" value="${esc(p.household)}" placeholder="–"><span class="unit">人</span></div></div>
    <div class="field"><label class="lbl">居住地（県）</label>
      <input type="text" data-f="area" value="${esc(p.area)}" placeholder="–"></div>
    <div class="field"><label class="lbl">地元</label>
      <input type="text" data-f="hometown" value="${esc(p.hometown)}" placeholder="–"></div>
    <div class="field span2"><label class="lbl">職業</label>
      <input type="text" data-f="job" value="${esc(p.job)}" placeholder="–"></div>
    <div class="field"><label class="lbl">雇用形態</label>
      <div class="pick" data-pick="emp">${EMP.map(e=>btn(e[0],e[0],p.emp===e[0],e[1])).join('')}</div></div>
    <div class="field"><label class="lbl">最終学歴</label>
      <div class="pick" data-pick="edu">${EDU.map(e=>btn(e[0],e[0],p.edu===e[0],e[1])).join('')}</div></div>
    <div class="field full"><label class="lbl">メモ</label>
      <input type="text" data-f="memo" value="${esc(p.memo)}" placeholder="きっかけ・関係性・温度感など"></div>
  </div>
  <div class="stagewrap">
    <label class="lbl">進捗（タップでオン／オフ）</label>
    <div class="chips" data-chips="1">
      ${STAGES.map(s=>`<button class="chip" type="button" data-stage="${s.k}" aria-pressed="${p.stages[s.k]?'true':'false'}">${s.l}</button>`).join('')}
    </div>
  </div>`;
}
function btn(val,txt,on,title){
  return `<button type="button" data-val="${val}" aria-pressed="${on?'true':'false'}"${title?` title="${title}"`:''}>${txt}</button>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* ---------- wiring ---------- */
function wire(el,i){
  el.querySelectorAll('input[data-f]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      data[i][inp.dataset.f]=inp.value;save();
      if(['name','age','area','job'].includes(inp.dataset.f)){liveHead(el,i);summary();}
    });
    inp.addEventListener('click',e=>e.stopPropagation());
  });
  el.querySelectorAll('.pick').forEach(pk=>{
    const field=pk.dataset.pick;
    pk.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click',e=>{
        e.stopPropagation();
        const v=b.dataset.val,cur=data[i][field]===v;
        data[i][field]=cur?'':v;
        pk.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
        if(!cur)b.setAttribute('aria-pressed','true');
        save();
      });
    });
  });
  el.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click',e=>{
      e.stopPropagation();
      const k=c.dataset.stage,nv=!data[i].stages[k];
      data[i].stages[k]=nv;c.setAttribute('aria-pressed',nv?'true':'false');
      const n=heatCount(data[i]);
      el.dataset.heat=heatLevel(n);
      el.querySelectorAll('.pip').forEach((p,idx)=>p.classList.toggle('on',idx<n));
      el.querySelector('.hcount').textContent=n+'/10';
      summary();save();
    });
  });
}
function liveHead(el,i){
  const p=data[i];
  const nm=el.querySelector('.nm');
  nm.textContent=p.name.trim()||'未入力';
  nm.classList.toggle('empty',!p.name.trim());
  const bits=[];if(p.age)bits.push(p.age+'歳');if(p.area)bits.push(p.area);if(p.job)bits.push(p.job);
  el.querySelector('.meta').textContent=bits.length?bits.join(' · '):'タップして入力';
}

/* ---------- controls ---------- */
document.getElementById('sort-no').onclick=()=>setSort('no');
document.getElementById('sort-heat').onclick=()=>setSort('heat');
function setSort(m){sortMode=m;
  document.getElementById('sort-no').setAttribute('aria-pressed',m==='no');
  document.getElementById('sort-heat').setAttribute('aria-pressed',m==='heat');
  render();}
document.getElementById('btn-collapse').onclick=()=>{openIdx.clear();render();};

/* ---------- export ---------- */
const COLS=['No','フルネーム','性別','年齢','居住地','世帯人数','地元','職業','雇用形態','最終学歴',
  ...STAGES.map(s=>s.l),'メモ'];
function rows(){
  return data.map((p,i)=>[i+1,p.name,p.sex,p.age,p.area,p.household,p.hometown,p.job,p.emp,p.edu,
    ...STAGES.map(s=>p.stages[s.k]?'○':''),p.memo]);
}
function tsv(){return [COLS.join('\t'),...rows().map(r=>r.join('\t'))].join('\n');}
function csv(){
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return '\uFEFF'+[COLS.map(q).join(','),...rows().map(r=>r.map(q).join(','))].join('\r\n');
}
const scrim=document.getElementById('scrim');
function openExport(){document.getElementById('exp-area').value=tsv();scrim.classList.add('show');}
document.getElementById('btn-export').onclick=openExport;
document.getElementById('btn-export2').onclick=openExport;
document.getElementById('exp-close').onclick=()=>scrim.classList.remove('show');
scrim.addEventListener('click',e=>{if(e.target===scrim)scrim.classList.remove('show');});
document.getElementById('exp-copy').onclick=async()=>{
  const ta=document.getElementById('exp-area');ta.focus();ta.select();
  let ok=false;
  try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(e){
    try{ok=document.execCommand('copy');}catch(_){}
  }
  const b=document.getElementById('exp-copy');b.textContent=ok?'コピーしました':'長押しでコピー';
  setTimeout(()=>b.textContent='コピー',1600);
};
document.getElementById('exp-csv').onclick=()=>{
  try{
    const blob=new Blob([csv()],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='hotlist20.csv';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  }catch(e){alert('保存できない場合は、上のテキストをコピーして使ってください。');}
};

/* ---------- go ---------- */
(async()=>{await load();render();})();
</script>
